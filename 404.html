<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Futurezy</title>
<style>
  :root { --bg: #fbfbfd; --fg: #1d1d27; --muted: #5b5b6b; --accent: #5b5bd6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14141a; --fg: #ececf2; --muted: #a3a3b5; --accent: #9d9dff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.65;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 5rem 1.25rem;
  }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 1rem; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  a { color: var(--accent); text-underline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>That page doesn't exist.</p>
  <a href="/">Go to the Futurezy home page</a>
</main>
</body>
</html>
